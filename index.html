<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Realidade Aumentada - Exposição "Do olhar de Malagoli ao nosso: o Patrimônio de Rio Preto hoje"</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #inicio {
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #inicio-conteudo {
            width: 85%;
            max-width: 500px;
            color: white;
        }

        #inicio h1 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        #inicio p {
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        #botao-iniciar {
            border: none;
            padding: 15px 28px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        #carregando {
            display: none;
            color: white;
            font-size: 18px;
        }

        #mensagem {
            position: fixed;
            z-index: 5;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <!-- Tela inicial -->
    <div id="inicio">
        <div id="inicio-conteudo">
            <h1>Exposição "Do olhar de Malagoli ao nosso: o Patrimônio de Rio Preto hoje"</h1>
            <p>
                Aponte a câmera do celular para uma das imagens
                indicadas na exposição para acessar o conteúdo
                em realidade aumentada.
            </p>
            <button id="botao-iniciar">
                Iniciar experiência
            </button>
            <div id="carregando">
                Carregando...
            </div>
        </div>
    </div>

    <div id="mensagem">
        Aponte a câmera para uma das imagens da exposição.
    </div>

    <!-- REALIDADE AUMENTADA -->
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- Conteúdo do alvo 1 -->
            <img id="texto1" src="./texto1.png">
            <!-- Conteúdo do alvo 2 -->
            <img id="texto2" src="./texto2.png">
        </a-assets>

        <!-- CÂMERA -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ALVO 1 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane id="plane-texto1" src="#texto1" position="0 0 0" width="2" height="2" material="transparent: true;"></a-plane>
        </a-entity>

        <!-- ALVO 2 -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-plane id="plane-texto2" src="#texto2" position="0 0 0" width="2" height="2" material="transparent: true;"></a-plane>
        </a-entity>

    </a-scene>

    <script>
        // Função atualizada para calcular a proporção com o dobro do tamanho (2x)
        function ajustarProporcao(idImg, idPlane) {
            const img = document.getElementById(idImg);
            const plane = document.getElementById(idPlane);

            const aplicar = () => {
                if (img.naturalWidth && img.naturalHeight) {
                    const ratio = img.naturalHeight / img.naturalWidth;
                    
                    // Multiplica por 2 para dobrar a escala sem distorcer a imagem
                    plane.setAttribute('width', 2);
                    plane.setAttribute('height', ratio * 2);
                }
            };

            if (img.complete) {
                aplicar();
            } else {
                img.addEventListener('load', aplicar);
            }
        }

        // Executa o ajuste dobrado para as imagens
        ajustarProporcao('texto1', 'plane-texto1');
        ajustarProporcao('texto2', 'plane-texto2');

        // Controle dos botões
        const botao = document.getElementById("botao-iniciar");
        const inicio = document.getElementById("inicio");
        const carregando = document.getElementById("carregando");
        const mensagem = document.getElementById("mensagem");
        const scene = document.querySelector("a-scene");

        botao.addEventListener("click", async function () {
            botao.style.display = "none";
            carregando.style.display = "block";

            try {
                const mindarSystem = scene.systems["mindar-image-system"];
                await mindarSystem.start();

                inicio.style.display = "none";
                mensagem.style.display = "block";

                setTimeout(function () {
                    mensagem.style.display = "none";
                }, 4000);

            } catch (erro) {
                console.error(erro);
                carregando.innerHTML = "Não foi possível acessar a câmera. Verifique as permissões do navegador.";
            }
        });
    </script>
</body>

</html>
