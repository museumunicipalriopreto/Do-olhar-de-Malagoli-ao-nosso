<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Realidade Aumentada - Exposição</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        #inicio {
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #inicio-conteudo {
            width: 85%;
            max-width: 500px;
            color: white;
        }

        #inicio h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        #inicio p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        #botao-iniciar {
            border: none;
            padding: 15px 28px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }

        #carregando {
            display: none;
            color: white;
            font-size: 18px;
        }

        #mensagem {
            position: fixed;
            z-index: 5;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        /* PAINEL FIXO EM ECRÃ INTEIRO PARA OS TEXTOS */
        #overlay-texto {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 8;
            display: none;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        #overlay-texto img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Mantém a proporção exata ocupando o máximo do ecrã */
        }
    </style>
</head>

<body>

    <div id="inicio">
        <div id="inicio-conteudo">
            <h1>Exposição Malagoli</h1>
            <p>
                Aponte a câmera do celular para uma das imagens
                indicadas na exposição para acessar o conteúdo.
            </p>
            <button id="botao-iniciar">Iniciar experiência</button>
            <div id="carregando">Carregando câmara...</div>
        </div>
    </div>

    <div id="mensagem">
        Aponte a câmera para uma das imagens da exposição.
    </div>

    <!-- EXIBIÇÃO FIXA EM ECRÃ INTEIRO (2D) -->
    <div id="overlay-texto">
        <img id="imagem-exibida" src="" alt="Texto da Exposição">
    </div>

    <!-- CENA AR (APENAS PARA RASTREAMENTO) -->
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ALVO 1 -->
        <a-entity id="target1" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- ALVO 2 -->
        <a-entity id="target2" mindar-image-target="targetIndex: 1"></a-entity>

    </a-scene>

    <script>
        const overlay = document.getElementById("overlay-texto");
        const imagemExibida = document.getElementById("imagem-exibida");

        const target1 = document.getElementById("target1");
        const target2 = document.getElementById("target2");

        // Quando encontra o Alvo 1
        target1.addEventListener("targetFound", () => {
            imagemExibida.src = "./texto1.png";
            overlay.style.display = "flex";
        });

        target1.addEventListener("targetLost", () => {
            overlay.style.display = "none";
        });

        // Quando encontra o Alvo 2
        target2.addEventListener("targetFound", () => {
            imagemExibida.src = "./texto2.png";
            overlay.style.display = "flex";
        });

        target2.addEventListener("targetLost", () => {
            overlay.style.display = "none";
        });

        // Controle da interface de início
        const botao = document.getElementById("botao-iniciar");
        const inicio = document.getElementById("inicio");
        const carregando = document.getElementById("carregando");
        const mensagem = document.getElementById("mensagem");
        const scene = document.querySelector("a-scene");

        botao.addEventListener("click", async function () {
            botao.style.display = "none";
            carregando.style.display = "block";

            try {
                const mindarSystem = scene.systems["mindar-image-system"];
                await mindarSystem.start();

                inicio.style.display = "none";
                mensagem.style.display = "block";

                setTimeout(() => {
                    mensagem.style.display = "none";
                }, 4000);

            } catch (erro) {
                console.error("Erro ao iniciar a câmara:", erro);
                carregando.innerHTML = "Não foi possível acessar a câmara. Verifique as permissões do navegador.";
            }
        });
    </script>
</body>

</html>
