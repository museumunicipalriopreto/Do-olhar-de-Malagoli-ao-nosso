<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Realidade Aumentada - Exposição</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Look-At seguro compatível com A-Frame 1.5.0 -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        #inicio {
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #inicio-conteudo {
            width: 85%;
            max-width: 500px;
            color: white;
        }

        #inicio h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        #inicio p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        #botao-iniciar {
            border: none;
            padding: 15px 28px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }

        #carregando {
            display: none;
            color: white;
            font-size: 18px;
        }

        #mensagem {
            position: fixed;
            z-index: 5;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="inicio">
        <div id="inicio-conteudo">
            <h1>Exposição Malagoli</h1>
            <p>
                Aponte a câmera do celular para uma das imagens
                indicadas na exposição para acessar o conteúdo.
            </p>
            <button id="botao-iniciar">Iniciar experiência</button>
            <div id="carregando">Carregando câmara e motor 3D...</div>
        </div>
    </div>

    <div id="mensagem">
        Aponte a câmera para uma das imagens da exposição.
    </div>

    <!-- Desativados os seletores UI automáticos do A-Frame para evitar congelamentos -->
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">

        <a-assets>
            <img id="texto1" src="./texto1.png">
            <img id="texto2" src="./texto2.png">
        </a-assets>

        <!-- Definição explícita do ID da câmara -->
        <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ALVO 1 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane id="plane-texto1" src="#texto1" position="0 0 0" width="2" height="2" material="transparent: true;" look-at="#main-camera"></a-plane>
        </a-entity>

        <!-- ALVO 2 -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-plane id="plane-texto2" src="#texto2" position="0 0 0" width="2" height="2" material="transparent: true;" look-at="#main-camera"></a-plane>
        </a-entity>

    </a-scene>

    <script>
        function ajustarProporcao(idImg, idPlane) {
            const img = document.getElementById(idImg);
            const plane = document.getElementById(idPlane);

            const aplicar = () => {
                if (img.naturalWidth && img.naturalHeight) {
                    const ratio = img.naturalHeight / img.naturalWidth;
                    plane.setAttribute('width', 2);
                    plane.setAttribute('height', ratio * 2);
                }
            };

            if (img.complete) {
                aplicar();
            } else {
                img.addEventListener('load', aplicar);
            }
        }

        ajustarProporcao('texto1', 'plane-texto1');
        ajustarProporcao('texto2', 'plane-texto2');

        const botao = document.getElementById("botao-iniciar");
        const inicio = document.getElementById("inicio");
        const carregando = document.getElementById("carregando");
        const mensagem = document.getElementById("mensagem");
        const scene = document.querySelector("a-scene");

        botao.addEventListener("click", async function () {
            botao.style.display = "none";
            carregando.style.display = "block";

            try {
                // Aguarda o carregamento do motor A-Frame caso não esteja pronto
                if (!scene.hasLoaded) {
                    await new Promise(resolve => scene.addEventListener('loaded', resolve));
                }

                const mindarSystem = scene.systems["mindar-image-system"];
                await mindarSystem.start();

                inicio.style.display = "none";
                mensagem.style.display = "block";

                setTimeout(() => {
                    mensagem.style.display = "none";
                }, 4000);

            } catch (erro) {
                console.error("Erro de inicialização:", erro);
                carregando.innerHTML = "Erro ao aceder à câmara. Verifique as permissões do seu navegador.";
            }
        });
    </script>
</body>

</html>
